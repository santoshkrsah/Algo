[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fyers-data"
version = "0.1.0"
description = "Download Fyers historical F&O and NSE equity data for backtesting"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "pyotp>=2.9",
    "reportlab>=4.2",
    "pypdfium2>=4.30",
]

[tool.setuptools.packages.find]
where = ["src"]
